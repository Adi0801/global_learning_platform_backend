services:
  postgres:
    image: postgres:16-alpine
    container_name: global-learning-postgres
    environment:
      POSTGRES_DB: global_learning_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d global_learning_platform"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: global-learning-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/global_learning_platform
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    ports:
      - "8080:8080"

volumes:
  postgres_data:
